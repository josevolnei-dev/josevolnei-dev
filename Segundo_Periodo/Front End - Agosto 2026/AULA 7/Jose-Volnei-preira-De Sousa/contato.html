
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <header>
        <h1>Entre em Contato</h1>
        <p>Envie uma mensagem</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>

        <section class="formulario">
            <h2>Formulário de Contato</h2>

            <form>

                <label for="nome">
                    Nome <span>*</span>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

                </label>

                <label for="email">
                    E-mail <span>*</span>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>


                </label>



                <label for="assunto">
                    Assunto <span>*</span>
                    <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto da mensagem" required>
                </label>



                <label for="mensagem">
                    Mensagem <span>*</span>
                    
                </label>
<textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem" required></textarea>


                <button type="submit">Enviar</button>

            </form>
        </section>

    </main>

    <footer>
        <p>Desenvolvido por: José Volnei Pereira de Sousa</p>
        <p>Trabalho da disciplina Desenvolvimento Front-end.</p>
    </footer>

</body>

</html>
